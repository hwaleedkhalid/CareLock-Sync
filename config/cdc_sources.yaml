# CareLock CDC sources — hospital_a (PostgreSQL, port 5435)
# HMAC secret lives in CDC_HMAC_KEY_HOSPITAL_A env var.
# Ingestion service reads CDC_HMAC_KEYS=hospital_a:<same secret>.

sources:
  - id: hospital_a
    db_url: postgresql://hospital_user:hospital_pass@localhost:5435/hospital_db
    tables:
      - patients
      - encounters
      - lab_results
      - medications
    poll_interval_seconds: 5
    poll_interval_min_seconds: 1
    listen_notify: true
    auto_setup: true
    ingestion_endpoint: http://localhost:8004/api/v1/cdc/ingest
    ingestion_health_endpoint: http://localhost:8004/healthz
    auth_key_env: CDC_HMAC_KEY_HOSPITAL_A
    admin_port: 9101
    batch:
      max_rows: 500
      max_bytes: 1048576
      max_latency_ms: 2000
    retry:
      max_attempts: 8
      initial_backoff_ms: 1000
      max_backoff_ms: 60000
      jitter_pct: 20
    schema:
      unknown_columns_default: store_raw
      new_table_policy: require_config
      registry_auto_stub: false
    fk:
      max_wait_seconds: 300
      allow_placeholder_parent: false
